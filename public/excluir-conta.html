<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Excluir conta — Conexão com Deus</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        line-height: 1.5;
        margin: 24px;
        color: #111827;
        background: #ffffff;
      }
      .container {
        max-width: 720px;
        margin: 0 auto;
      }
      h1 {
        font-size: 24px;
        margin-bottom: 8px;
      }
      p {
        margin: 8px 0;
      }
      .box {
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        padding: 16px;
        border-radius: 8px;
        margin-top: 16px;
      }
      .email {
        font-weight: 600;
      }
      ul {

  <body>
    <div class="container">
      <h1>Excluir conta</h1>
      <p>Para solicitar a exclusão da sua conta do app <strong>Conexão com Deus</strong>, envie um e-mail para:</p>
      <div class="box">
        <span class="email">mizflow0@gmail.com</span>
      </div>
      <p>Por favor, inclua no e-mail:</p>
      <ul>
        <li>O e-mail usado para criar a conta</li>
        <li>Seu nome (opcional)</li>
        <li>Motivo da exclusão (opcional)</li>
      </ul>
      <p>Seu pedido será processado em até 7 dias úteis.</p>
    </div>
